#the filename you need input
CFPs_filename: inpfile/CFPs_py.out        #The disturbed CFPs B_kq
mag_filename: inpfile/eqpyout   #The magnetic calculation of the eq structure
freq_filename: inpfile/freq_new.log     #The frequency file, including wavenumbers and normal modes vectors
POSCAR: inpfile/POSCAR           #The structure of  eq  
ESO_foldname: inpfile/ESO_TTO               #The information of element <J1M1|O_k^q|J2M2>, generated by easyspin in matlab
TO_foldname: inpfile/ESO_TTO             #The information of element <J1M1|O_k^q|J2M2>, generated by easyspin in matlab
#The path of outfile. If the files are exsisted, the program will read it
VP_filename: inpfile/VPpy0108_all_p.out
TPs_foldname: TPs/py0108_all_p
Out_foldname: TPs_file #The fold of the relaxation time
#the correction of freq
Correction_slope: 0.954 
Corrected_intercept: 0
#Correction_slope: 1   
#Corrected_intercept: 0

#the order you want to fit the Bkq
Fitting_order: 1    

#the displacement point of the CFPs,for xyz the unit is 1\AA, for normal mode is the zero point vibration mode
#CFPs_X: [-1,-0.8,-0.6,-0.4,-0.2,0,0.2,0.4,0.6,0.8,1] 
CFPs_X: [-0.1,-0.08,-0.06,-0.04,-0.02,0,0.02,0.04,0.06,0.08,0.1]  # for Xi_perb
#CFPs_X: [-1,0,1] 
#CFPs_X: [-0.2,-0.1,0,0.1,0.2] 
If_xyz: True

If_Perb: True
Perb_T: 0.01

#the Linewidth_parameters of the gaussian expansion of frequency
Linewidth_parameter: 10

#the temprature range. The T is integral
If_T_step: True
nTrange: 1               #the nTrange means the number of range. If it is 2, the program will read Trange1 and Trange2
#Trange1: 80,100,10
#the first number is the min value of the T, the second is the max. If If_T_step==True, the third number is the size of step of T, else it is the number of the T
Trange1: 50,130,10
Trange2: 20,40,5
Trange3: 8,10,1

#the function
If_get_picture_Tt: True
If_select_sigma: True
select_sigma: 100
If_Orbach: True
If_Raman: False


#the pre-entered relaxation time data you need
If_Data: True
ndata: 1                #the ndata means the number of line
#Tr means the data of 1/T
Tr1: [0.020035,0.020151,0.020384,0.020579,0.020734,0.021123,0.021239,0.021667,0.021900,0.022562,0.023184,0.024196,0.025558,0.026647,0.028632,0.030072,0.032096,0.034314,0.036960,0.039801,0.043421]
#logtime means the data of log(\tau)
logtime1: [-2.7146,-2.6825,-2.6311,-2.5412,-2.4737,-2.3935,-2.3196,-2.2618,-2.1976,-2.1077,-2.037,-1.9503,-1.8765,-1.8059,-1.6775,-1.6229,-1.5073,-1.3853,-1.2762,-1.1542,-1.0098]
label1: Exp

     

#Use the uniformization method
If_uniformization: False

If_Full: True
If_Simplified: False
SimVP_filename: "inpfile/test2/VP_exp12_rt_per2_gs"
SimTPs_foldname: "TPs_test2/TP_exp12_rt_per2_sig10_gs"
nloop: 3
